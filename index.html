<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoCare Fleet Manager</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1f2937; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">

    <!-- Top Navigation -->
    <nav class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="p-2 bg-indigo-600 rounded-lg text-white">
                        <i data-lucide="wrench" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold text-white leading-none">AutoCare</h1>
                        <span class="text-xs text-slate-400">Fleet Maintenance & Mileage Tracker</span>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <span id="sync-status" class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-slate-700 text-slate-300 gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-amber-400"></span> Local Mode
                    </span>

                    <button onclick="toggleSettingsModal()" class="p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-700 transition" title="Settings & Firebase Sync">
                        <i data-lucide="settings" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

        <!-- Vehicle Switcher & Header -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
            <div class="space-y-1">
                <span class="text-xs font-semibold uppercase tracking-wider text-indigo-400">Active Vehicle</span>
                <div class="flex items-center gap-3">
                    <select id="vehicle-select" onchange="switchVehicle(this.value)" class="bg-slate-900 text-white text-xl font-bold rounded-xl px-4 py-2 border border-slate-700 focus:outline-none focus:border-indigo-500 cursor-pointer">
                        <option value="perodua_alza">Perodua Alza SE</option>
                        <option value="mitsubishi_xpander">Mitsubishi Xpander</option>
                        <option value="yamaha_xmax">Yamaha XMAX 250</option>
                    </select>
                </div>
            </div>

            <!-- Stats Overview Cards -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 w-full md:w-auto">
                <div class="bg-slate-
